<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RestaurantFlow — Owner Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#C9A84C;--dark:#0E0C0A;--surface:#1E1B17;--surface2:#252118;--border:rgba(201,168,76,0.2);--text:#F2EDE4;--muted:#9A9080;--dim:#5A5448;--red:#C44B3A;--green:#4A8C5C;--orange:#D4813A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;font-weight:300;min-height:100vh}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:14px;color:var(--gold);letter-spacing:.08em;text-transform:uppercase;font-weight:500}
.restaurant-name{font-size:16px;color:var(--text);font-weight:400}
.main{max-width:1100px;margin:0 auto;padding:32px 24px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 24px}
.stat-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.stat-value{font-size:32px;font-weight:500;color:var(--text)}
.stat-value.hot{color:var(--red)}
.stat-value.green{color:var(--green)}
.section-title{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;margin-top:32px}
.inquiry-table{width:100%;border-collapse:collapse}
.inquiry-table th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;padding:10px 16px;border-bottom:1px solid var(--border);font-weight:400}
.inquiry-table td{padding:14px 16px;border-bottom:1px solid rgba(201,168,76,0.08);font-size:14px;vertical-align:middle}
.inquiry-table tr:hover td{background:rgba(201,168,76,0.04)}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500;letter-spacing:.04em}
.badge-hot{background:rgba(196,75,58,.15);color:var(--red);border:1px solid rgba(196,75,58,.3)}
.badge-warm{background:rgba(212,129,58,.12);color:var(--orange);border:1px solid rgba(212,129,58,.3)}
.badge-normal{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border)}
.badge-new{background:rgba(201,168,76,.12);color:var(--gold);border:1px solid rgba(201,168,76,.3)}
.badge-contacted{background:rgba(74,140,92,.12);color:var(--green);border:1px solid rgba(74,140,92,.3)}
.badge-booked{background:rgba(74,140,92,.2);color:var(--green);border:1px solid rgba(74,140,92,.5)}
.badge-recovery{background:rgba(196,75,58,.2);color:var(--red);border:1px solid var(--red)}
.status-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:4px 12px;border-radius:8px;font-size:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.status-btn:hover{border-color:var(--gold);color:var(--gold)}
.specials-section{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;margin-top:32px}
.specials-title{font-size:14px;color:var(--text);font-weight:500;margin-bottom:16px}
.special-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(201,168,76,0.08)}
.special-row:last-child{border-bottom:none}
.special-name{flex:1;font-size:14px}
.special-price{color:var(--gold);font-size:14px;font-weight:500;width:60px}
.toggle{position:relative;width:36px;height:20px;cursor:pointer}
.toggle input{opacity:0;width:0;height:0}
.slider{position:absolute;top:0;left:0;right:0;bottom:0;background:var(--dim);border-radius:20px;transition:.3s}
.slider:before{content:"";position:absolute;height:14px;width:14px;left:3px;bottom:3px;background:white;border-radius:50%;transition:.3s}
input:checked+.slider{background:var(--green)}
input:checked+.slider:before{transform:translateX(16px)}
.empty-state{text-align:center;padding:60px 20px;color:var(--muted)}
.empty-state p{font-size:15px;margin-bottom:8px}
.empty-state small{font-size:13px;color:var(--dim)}
.refresh-btn{background:none;border:1px solid var(--border);color:var(--muted);padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.refresh-btn:hover{border-color:var(--gold);color:var(--gold)}
.topbar-right{display:flex;align-items:center;gap:12px}
</style>
</head>
<body>
<div class="topbar">
  <div>
    <div class="logo">RestaurantFlow &mdash; Owner Dashboard</div>
    <div class="restaurant-name" id="restaurantName">Loading...</div>
  </div>
  <div class="topbar-right">
    <button class="refresh-btn" onclick="loadData()">Refresh</button>
  </div>
</div>
<div class="main">
  <div class="stats">
    <div class="stat-card">
      <div class="stat-label">Total Inquiries</div>
      <div class="stat-value" id="statTotal">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">New Today</div>
      <div class="stat-value hot" id="statNew">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Hot Leads</div>
      <div class="stat-value hot" id="statHot">0</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Booked</div>
      <div class="stat-value green" id="statBooked">0</div>
    </div>
  </div>

  <div class="section-title">Recent Inquiries</div>
  <table class="inquiry-table">
    <thead>
      <tr>
        <th>Guest</th>
        <th>Type</th>
        <th>Date Requested</th>
        <th>Guests</th>
        <th>Urgency</th>
        <th>Status</th>
        <th>Received</th>
        <th>Action</th>
      </tr>
    </thead>
    <tbody id="inquiryBody">
      <tr><td colspan="8"><div class="empty-state"><p>No inquiries yet</p><small>Sofia will send them here as they come in</small></div></td></tr>
    </tbody>
  </table>

  <div class="specials-section">
    <div class="specials-title">Today's Specials</div>
    <div id="specialsList"></div>
  </div>
</div>
<script>
var inquiries = [];
function loadData() {
  fetch('/api/health').then(function(r){return r.json();}).then(function(h){
    document.getElementById('restaurantName').textContent = h.restaurant || 'Restaurant';
  }).catch(function(){});
  fetch('/api/inquiries').then(function(r){return r.json();}).then(function(data){
    inquiries = data.inquiries || [];
    renderStats(inquiries);
    renderInquiries(inquiries);
  }).catch(function(e){console.error(e);});
  fetch('/api/specials').then(function(r){return r.json();}).then(function(data){
    renderSpecials(data.specials || []);
  }).catch(function(){renderSpecials([]);});
}
function renderStats(list) {
  var today = new Date().toDateString();
  var newToday = list.filter(function(i){ return new Date(i.createdAt).toDateString() === today; }).length;
  var hot = list.filter(function(i){ return i.urgency === 'urgent' || i.urgency === 'high' || i.serviceRecoveryRisk; }).length;
  var booked = list.filter(function(i){ return i.status === 'booked'; }).length;
  document.getElementById('statTotal').textContent = list.length;
  document.getElementById('statNew').textContent = newToday;
  document.getElementById('statHot').textContent = hot;
  document.getElementById('statBooked').textContent = booked;
}
function urgencyBadge(i) {
  if (i.serviceRecoveryRisk) return '<span class="badge badge-recovery">Recovery</span>';
  if (i.urgency === 'urgent') return '<span class="badge badge-hot">Urgent</span>';
  if (i.urgency === 'high') return '<span class="badge badge-hot">Hot</span>';
  if (i.urgency === 'medium') return '<span class="badge badge-warm">Warm</span>';
  return '<span class="badge badge-normal">Normal</span>';
}
function statusBadge(s) {
  if (s === 'booked') return '<span class="badge badge-booked">Booked</span>';
  if (s === 'contacted') return '<span class="badge badge-contacted">Contacted</span>';
  return '<span class="badge badge-new">New</span>';
}
function timeAgo(dateStr) {
  var diff = Date.now() - new Date(dateStr).getTime();
  var mins = Math.floor(diff/60000);
  if (mins < 60) return mins + 'm ago';
  var hrs = Math.floor(mins/60);
  if (hrs < 24) return hrs + 'h ago';
  return Math.floor(hrs/24) + 'd ago';
}
function updateStatus(id, status) {
  fetch('/api/inquiries/'+id+'/status', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:status})})
    .then(function(){loadData();}).catch(function(e){console.error(e);});
}
function renderInquiries(list) {
  var tbody = document.getElementById('inquiryBody');
  if (!list.length) {
    tbody.innerHTML = '<tr><td colspan="8"><div class="empty-state"><p>No inquiries yet</p><small>Sofia will send them here as they come in</small></div></td></tr>';
    return;
  }
  var sorted = list.slice().sort(function(a,b){return new Date(b.createdAt)-new Date(a.createdAt);});
  tbody.innerHTML = sorted.map(function(i){
    return '<tr><td><strong>'+( i.customerName||'Unknown')+'</strong></td><td>'+(i.inquiryType||'General')+'</td><td>'+(i.date||'TBD')+'</td><td>'+(i.guestCount||'?')+'</td><td>'+urgencyBadge(i)+'</td><td>'+statusBadge(i.status)+'</td><td>'+timeAgo(i.createdAt)+'</td><td><button class="status-btn" onclick="updateStatus('+i.id+',\'contacted\')">Mark Contacted</button> <button class="status-btn" onclick="updateStatus('+i.id+',\'booked\')">Booked</button></td></tr>';
  }).join('');
}
function renderSpecials(specials) {
  var el = document.getElementById('specialsList');
  if (!specials.length) { el.innerHTML = '<div style="color:var(--muted);font-size:14px">No specials configured</div>'; return; }
  el.innerHTML = specials.map(function(s){
    return '<div class="special-row"><div class="special-name">'+s.name+'</div><div class="special-price">$'+s.price+'</div><label class="toggle"><input type="checkbox"'+(s.active?' checked':'')+'><span class="slider"></span></label></div>';
  }).join('');
}
loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
